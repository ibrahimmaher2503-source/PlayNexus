x-playnexus-approved-decisions:
  receipt_numbering: branch-scoped unique BRANCH-YYYY-000001; voided records retained
  checkout_verification: QR plus registered_guardian_phone_last4_or_handoff_code; manager_override_audited
  pricing: fixed_duration; grace_seconds 600; overtime_unit_seconds 1800; pause_disabled; integer_minor_units; configurable_tax
  ticket_scope: tenant_and_branch; branch_local_service_date; holder_locks_on_first_accepted_scan; rejected_scans_do_not_lock; unused_only_refund_eligibility_with_manager_approval
x-playnexus-implemented-web-ticketing:
  authentication: Laravel session plus CSRF and active tenant access; not the external bearer API below
  identifier_type: bigint
  routes:
    - GET /app/tickets
    - POST /app/ticket-types
    - POST /app/tickets
    - POST /app/tickets/scan
    - PATCH /app/tickets/{ticket}/assignment
    - POST /app/tickets/{ticket}/cancel
    - POST /app/tickets/{ticket}/reprint
    - GET /app/sessions
    - POST /app/sessions/check-in
  specification: ../09-API-Specification.md
  validity: branch-local service_date; immutable UTC half-open operating window and timezone snapshot
  idempotency: issue and validation scan require tenant-actor-scoped UUID and canonical fingerprint
  authorization: fixed owner or assigned manager/reception/cashier; type creation and cancellation manager-only
  family_guard: verified active checkout-capable relationship; latest granted child_data consent; emergency contact
  qr: opaque random payload encrypted at rest; SHA-256 lookup; local client rendering; non-cacheable authorized artifact
  check_in: authorized ticket-backed consumption plus one Active play session; tenant-wide child uniqueness and hard branch capacity; UUID replay safety
  exclusions: validation alone does not consume; cancellation is not payment refund; checkout, final charge, payment and refund commands remain planned
openapi: 3.1.0
info:
  title: PlayNexus MVP API
  version: 1.0.0
  summary: Tenant-safe operational API for PlayNexus
  description: >-
    Versioned REST contract for the PlayNexus Phase 1 MVP. Tenant context is
    derived from the authenticated identity; tenant_id is never accepted as a
    writable field on tenant-owned resources. Money is expressed in minor
    units and all timestamps are UTC RFC 3339 values.
servers:
  - url: https://api.example.com/api/v1
    description: Environment-specific base URL
tags:
  - name: Authentication
  - name: Platform
  - name: Branches
  - name: Staff
  - name: Customers
  - name: Pricing
  - name: Tickets
  - name: Sessions
  - name: Approvals
  - name: POS
  - name: Incidents
  - name: Notifications
  - name: Reports
  - name: Audit
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Exchange staff credentials for an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reception@example.test
              password: correct-horse-battery-staple
              token_name: Reception Tablet 1
      responses:
        '200':
          description: Authenticated; plaintext token is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current API token
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the effective user, roles, branches, and abilities
      responses:
        '200':
          description: Effective identity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset message without revealing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted for both known and unknown syntactically valid emails
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password-reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Consume a single-use token and reset a staff password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset; active web sessions and API tokens revoked
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /platform/tenants:
    get:
      tags: [Platform]
      operationId: listTenants
      summary: List tenant account metadata
      description: 'Permission: platform.tenants.view.'
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenantStatus'
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Platform]
      operationId: createTenant
      summary: Create a pending tenant and owner invitation
      description: 'Permission: platform.tenants.create.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /platform/tenants/{tenant_id}:
    patch:
      tags: [Platform]
      operationId: updateTenant
      summary: Update tenant metadata or lifecycle status
      description: 'Permission: platform.tenants.status or the relevant platform ability.'
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /branches:
    get:
      tags: [Branches]
      operationId: listBranches
      summary: List branches visible to the current actor
      description: 'Permission: branches.view.'
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BranchStatus'
      responses:
        '200':
          description: Branch page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Branches]
      operationId: createBranch
      summary: Create a branch in the authenticated tenant
      description: 'Permission: branches.create_archive.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /branches/{branch_id}:
    get:
      tags: [Branches]
      operationId: getBranch
      summary: Get a visible branch
      description: 'Permission: branches.view.'
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Branches]
      operationId: updateBranch
      summary: Update branch configuration
      description: 'Permission: branches.update or the action-specific branch permission.'
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdateRequest'
      responses:
        '200':
          description: Updated branch
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: List staff visible in the actor's tenant and branch scope
      description: 'Permission: staff.view.'
      parameters:
        - $ref: '#/components/parameters/BranchFilter'
        - name: status
          in: query
          schema:
            type: string
            enum: [invited, active, suspended, disabled]
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Staff page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      operationId: createStaff
      summary: Invite a staff member with allowed roles and branch assignments
      description: 'Permission: staff.manage plus the applicable role/branch assignment permissions.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '201':
          description: Staff invitation created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /staff/{user_id}:
    patch:
      tags: [Staff]
      operationId: updateStaff
      summary: Update staff profile, status, roles, or branch assignments
      description: 'Permission: staff.manage plus the applicable role/branch assignment permissions.'
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdateRequest'
      responses:
        '200':
          description: Updated staff member
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /guardians:
    get:
      tags: [Customers]
      operationId: searchGuardians
      summary: Search tenant guardians with role-based masking
      description: 'Permission: customers.search.'
      parameters:
        - name: search
          in: query
          required: true
          description: Normalized phone or name fragment
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Guardian matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Guardian'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Customers]
      operationId: createGuardian
      summary: Register a guardian
      description: 'Permission: guardians.create.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianCreateRequest'
      responses:
        '201':
          description: Guardian created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Guardian'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /guardians/{guardian_id}:
    get:
      tags: [Customers]
      operationId: getGuardian
      summary: Get a guardian visible to the current actor
      description: 'Permission: guardians.view.'
      parameters:
        - $ref: '#/components/parameters/GuardianId'
      responses:
        '200':
          description: Guardian
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Guardian'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customers]
      operationId: updateGuardian
      summary: Update guardian contact/preferences
      description: 'Permission: guardians.update; consent fields require guardians.consent.manage.'
      parameters:
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianUpdateRequest'
      responses:
        '200':
          description: Updated guardian
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Guardian'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /guardians/{guardian_id}/children:
    post:
      tags: [Customers]
      operationId: createGuardianChild
      summary: Create a child and guardian relationship atomically
      description: 'Permission: children.manage.'
      parameters:
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreateRequest'
