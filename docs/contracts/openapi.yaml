        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guardians/{guardian_id}/children/{child_id}/consent:
    patch:
      tags: [Customers]
      operationId: withdrawFamilyConsent
      summary: Append a child-data or marketing consent withdrawal
      description: 'Permission: guardians.consent.manage. Child-data withdrawal restricts the child from active workflows; retained evidence is not overwritten.'
      parameters:
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent_type]
              properties:
                consent_type:
                  type: string
                  enum: [child_data, marketing]
      responses:
        '200':
          description: Withdrawal recorded
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /guardians/{guardian_id}/children/{child_id}/relationships/{related_guardian_id}:
    delete:
      tags: [Customers]
      operationId: revokeGuardianChildRelationship
      summary: Revoke one relationship while preserving the final legal guardian
      description: 'Permission: relationships.manage. The mutation is transactional, version-checked, and rejects removal of the final active checkout-capable legal guardian.'
      parameters:
        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/ChildId'
        - name: related_guardian_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Relationship revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
