          type: string
          enum: [time_add, time_remove, charge_add, charge_remove]
        seconds_delta:
          type: integer
          minimum: 1
          description: Required only for time_add/time_remove; the sign is derived from kind.
        amount_minor:
          type: integer
          minimum: 1
          description: Required only for charge_add/charge_remove; the sign is derived from kind.
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        approval_id:
          $ref: '#/components/schemas/Ulid'
      allOf:
        - if:
            properties:
              kind:
                enum: [time_add, time_remove]
          then:
            required: [seconds_delta]
            not:
              required: [amount_minor]
        - if:
            properties:
              kind:
                enum: [charge_add, charge_remove]
          then:
            required: [amount_minor, currency]
            not:
              required: [seconds_delta]
