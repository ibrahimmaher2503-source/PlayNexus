        - $ref: '#/components/parameters/GuardianId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianChildRelationshipCreateRequest'
