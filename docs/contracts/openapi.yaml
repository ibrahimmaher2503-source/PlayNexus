              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customers]
