  /guardians/{guardian_id}/relationships:
    post:
      tags: [Customers]
      operationId: linkGuardianChildRelationship
      summary: Link an existing child to a guardian after staff verification
      description: 'Permission: relationships.manage. Registered-phone last four digits are checked server-side and never stored.'
