        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdateRequest'
      responses:
        '200':
          description: Updated child
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /pricing-rules:
    get:
      tags: [Pricing]
      operationId: listPricingRules
      summary: List effective pricing rules
      description: 'Permission: pricing.view.'
      parameters:
        - $ref: '#/components/parameters/BranchFilter'
