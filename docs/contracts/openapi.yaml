components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Revocable Laravel Sanctum token returned once at login.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Provider-specific HMAC/signature over the unmodified body and timestamp; verified before payload processing.
  headers:
    ETag:
      description: Quoted aggregate lock version.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
        example: '"3"'
  parameters:
    PageSize:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 500
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique command key scoped to actor, tenant, and operation.
      schema:
        type: string
        minLength: 16
        maxLength: 100
        pattern: '^[!-~]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current lock_version, for example "3".
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    BranchId:
      name: branch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    GuardianId:
      name: guardian_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ChildId:
      name: child_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TicketTypeId:
      name: ticket_type_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    Provider:
      name: provider
      in: path
      required: true
      description: Configured notification-provider code; values are deployment configuration, not an open client enum.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[a-z0-9][a-z0-9_-]*$'
    ProviderTimestamp:
      name: X-Provider-Timestamp
      in: header
      required: true
      description: Provider-signed event timestamp used for replay-window validation.
      schema:
        type: string
        maxLength: 100
    BranchFilter:
      name: branch_id
      in: query
      description: Restricts results to an authorized branch.
      schema:
        $ref: '#/components/schemas/Ulid'
    BranchFilterRequired:
      name: branch_id
      in: query
      required: true
      description: Required authorized branch whose sellable catalog is requested.
      schema:
        $ref: '#/components/schemas/Ulid'
    FromDate:
      name: from
      in: query
      required: true
      description: Inclusive branch-local date.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      description: Exclusive branch-local date.
      schema:
        type: string
        format: date
    FromDateTime:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    ToDateTime:
      name: to
      in: query
      schema:
        type: string
        format: date-time
  responses:
    SessionUpdated:
      description: Updated session
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Session'
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Authentication is missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.playnexus.example/problems/unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
            detail: A valid bearer token is required.
            instance: /api/v1/auth/me
            request_id: b7b7629e-1259-4ee0-a65e-262419c20ef0
    Forbidden:
      description: The actor lacks permission for this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is outside the visible scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current state, version, capacity, or idempotency record
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request is syntactically valid JSON but fails semantic validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A required If-Match header is missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required service is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      example: 01K3F26MGG34P4KZVY8W2RQ1AX
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      example: EGP
    LockVersion:
      type: integer
      minimum: 1
      example: 1
    TenantStatus:
      type: string
      enum: [pending, active, suspended, closed]
    BranchStatus:
      type: string
      enum: [active, inactive]
    SessionStatus:
      type: string
      enum: [active, paused, completed, cancelled]
    TicketStatus:
      type: string
      enum: [issued, consumed, cancelled, expired]
    OrderStatus:
      type: string
      enum: [draft, paid, refunded, voided]
    ApprovalAction:
      type: string
      enum: [discount, refund, session_adjustment, session_cancel, checkout_override, ticket_cancel, order_void]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired, consumed]
    NotificationStatus:
      type: string
      enum: [queued, sending, sent, delivered, failed_retryable, failed_permanent, stale]
    PaginationMeta:
      type: object
      required: [next_cursor, per_page]
      properties:
        next_cursor:
          type: [string, 'null']
        per_page:
          type: integer
          minimum: 1
          maximum: 100
    PaginationLinks:
      type: object
      required: [next]
      properties:
        next:
          type: [string, 'null']
          format: uri
    PaginatedResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON Pointer to the invalid input.
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, detail, instance, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, token_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 190
        password:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
        token_name:
          type: string
          minLength: 2
          maxLength: 100
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 190
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
          maxLength: 190
        token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        password:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
    CurrentUser:
      type: object
      required: [id, name, user_type, roles, branch_ids, abilities]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        user_type:
          type: string
          enum: [platform, tenant]
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        branch_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Ulid'
        abilities:
          type: array
          uniqueItems: true
          items:
            type: string
        locale:
          type: string
          enum: [ar, en]
    StaffUser:
      type: object
      required: [id, name, email, status, roles, branch_ids, locale, lock_version]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          maxLength: 190
        email:
          type: string
          format: email
          maxLength: 190
        phone_e164:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        status:
          type: string
          enum: [invited, active, suspended, disabled]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [tenant_owner, branch_manager, reception, cashier]
        branch_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Ulid'
        locale:
          type: string
          enum: [ar, en]
        last_login_at:
          type: [string, 'null']
          format: date-time
        lock_version:
          $ref: '#/components/schemas/LockVersion'
    StaffCreateRequest:
      type: object
      additionalProperties: false
      required: [name, email, roles, branch_ids, locale]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 190
        email:
          type: string
          format: email
          maxLength: 190
        phone_e164:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [tenant_owner, branch_manager, reception, cashier]
        branch_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Ulid'
        locale:
          type: string
          enum: [ar, en]
    StaffUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 190
        phone_e164:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        status:
          type: string
          enum: [active, suspended, disabled]
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [tenant_owner, branch_manager, reception, cashier]
        branch_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Ulid'
        locale:
          type: string
          enum: [ar, en]
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, token_type, expires_at, user]
          properties:
            token:
              type: string
              readOnly: true
            token_type:
              type: string
              const: Bearer
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/CurrentUser'

    Tenant:
      type: object
      required:
        - id
        - plan_id
        - legal_name
        - display_name
        - slug
        - status
        - billing_status
        - currency
        - locale
        - lock_version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        plan_id:
          $ref: '#/components/schemas/Ulid'
        legal_name:
          type: string
        display_name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        billing_status:
          type: string
          enum: [trial, current, past_due, cancelled]
        currency:
          $ref: '#/components/schemas/Currency'
        locale:
          type: string
          enum: [ar, en]
        lock_version:
          $ref: '#/components/schemas/LockVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [plan_id, legal_name, display_name, slug, currency, locale, owner]
      properties:
        plan_id:
          $ref: '#/components/schemas/Ulid'
        legal_name:
          type: string
          minLength: 2
          maxLength: 190
        display_name:
          type: string
          minLength: 2
          maxLength: 190
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 100
        currency:
          $ref: '#/components/schemas/Currency'
        locale:
          type: string
          enum: [ar, en]
        owner:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 190
            email:
              type: string
              format: email
              maxLength: 190
            phone_e164:
              type: string
              pattern: '^\+[1-9][0-9]{7,14}$'
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        plan_id:
          $ref: '#/components/schemas/Ulid'
        legal_name:
          type: string
          minLength: 2
          maxLength: 190
        display_name:
          type: string
          minLength: 2
          maxLength: 190
        status:
          $ref: '#/components/schemas/TenantStatus'
        billing_status:
          type: string
          enum: [trial, current, past_due, cancelled]

    BranchOpeningHour:
      type: object
      additionalProperties: false
      required: [weekday, is_closed, opens_at, closes_at]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, Monday=1 through Sunday=7.
        is_closed:
          type: boolean
        opens_at:
          type: [string, 'null']
          format: time
        closes_at:
          type: [string, 'null']
          format: time
      description: Server validation requires both times for an open day and neither time for a closed day; overnight-hour policy must be explicitly configured.
    Branch:
      type: object
      required:
        - id
        - code
        - name
        - status
        - timezone
        - capacity
        - currency
        - tax_rate_bps
        - tax_mode
        - discount_approval_bps
        - opening_hours
        - lock_version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        code:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/BranchStatus'
        timezone:
          type: string
          example: Africa/Cairo
        capacity:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        tax_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        tax_mode:
          type: string
          enum: [exclusive, inclusive]
        discount_approval_bps:
          type: integer
          minimum: 0
          maximum: 10000
        address:
          type: object
          additionalProperties: true
        opening_hours:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BranchOpeningHour'
        lock_version:
          $ref: '#/components/schemas/LockVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BranchCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, timezone, capacity, currency, tax_rate_bps, tax_mode, opening_hours]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_-]+$'
          minLength: 2
          maxLength: 30
        name:
          type: string
          minLength: 2
          maxLength: 190
        timezone:
          type: string
          minLength: 3
          maxLength: 64
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        currency:
          $ref: '#/components/schemas/Currency'
        tax_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        tax_mode:
          type: string
          enum: [exclusive, inclusive]
        discount_approval_bps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        address:
          type: object
          additionalProperties: true
        opening_hours:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BranchOpeningHour'
    BranchUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 190
        status:
          $ref: '#/components/schemas/BranchStatus'
        timezone:
          type: string
          minLength: 3
          maxLength: 64
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        tax_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        tax_mode:
          type: string
          enum: [exclusive, inclusive]
        discount_approval_bps:
          type: integer
          minimum: 0
          maximum: 10000
        address:
          type: object
          additionalProperties: true
        opening_hours:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BranchOpeningHour'

    Guardian:
      type: object
      required:
        - id
        - full_name
        - phone_masked
        - preferred_locale
        - status
        - lock_version
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        full_name:
          type: string
        phone_masked:
          type: string
        email_masked:
          type: [string, 'null']
        preferred_locale:
          type: string
          enum: [ar, en]
        marketing_consent:
          type: boolean
          description: Derived latest state only; append-only consent events are authoritative.
        status:
          type: string
          enum: [active, blocked, anonymized]
        lock_version:
          $ref: '#/components/schemas/LockVersion'
        created_at:
          type: string
          format: date-time
    GuardianCreateRequest:
      type: object
      additionalProperties: false
      description: Normalized phone is tenant-unique. A match returns the existing family; create-anyway and automatic merge are unsupported.
      required: [full_name, phone_e164, preferred_locale]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 190
        phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        secondary_phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        email:
          type: string
          format: email
          maxLength: 190
        preferred_locale:
          type: string
          enum: [ar, en]
        marketing_consent:
          type: boolean
          default: false
          description: Optional, separate, unchecked marketing consent; refusal does not block service and an append-only event is recorded.
    GuardianUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 190
        phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        secondary_phone_e164:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        email:
          type: [string, 'null']
          format: email
          maxLength: 190
        preferred_locale:
          type: string
          enum: [ar, en]
        marketing_consent:
          type: boolean
          description: Requests an append-only marketing grant/withdrawal event; no mutable Boolean is authoritative.
        marketing_opt_out:
          type: boolean

    Child:
      type: object
      description: DOB, derived age, and age-band fields are a proposed representation pending OQ-15 and are not contract-frozen.
      x-open-question: OQ-15
      required:
        - id
        - full_name
        - status
        - has_safety_notes
        - lock_version
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
          description: Proposed pending OQ-15; omitted when not selected by policy or when the actor may see only an age band.
        age_years:
          type: integer
          minimum: 0
        age_band:
          type: string
        status:
          type: string
          enum: [active, restricted, anonymized]
        photo_url:
          type: string
          format: uri
          description: Short-lived signed URL; omitted without photo permission.
        has_safety_notes:
          type: boolean
        safety_notes:
          type: string
          description: Omitted or masked without explicit permission.
        lock_version:
          $ref: '#/components/schemas/LockVersion'
        created_at:
          type: string
          format: date-time
    ChildCreateRequest:
      type: object
      additionalProperties: false
      description: Optional DOB follows approved OQ-15. Active registration requires emergency contact and explicit legal-guardian child-data consent.
      required: [full_name, relationship, can_check_out, is_primary, emergency_contact_name, emergency_contact_phone_e164, child_data_consent]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 190
        date_of_birth:
          type: string
          format: date
          description: Optional; age is derived when present and unnecessary precision must not be inferred.
        gender:
          type: string
          enum: [female, male, unspecified]
          default: unspecified
        relationship:
          type: string
          enum: [mother, father, legal_guardian, authorized_pickup, other]
        can_check_out:
          type: boolean
        is_primary:
          type: boolean
        emergency_contact_name:
          type: string
          maxLength: 190
        emergency_contact_phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        safety_notes:
          type: string
          maxLength: 1000
          description: Optional encrypted need-to-know operational note; excluded from normal logs and exports.
        child_data_consent:
          type: object
          additionalProperties: false
          required: [accepted, notice_version, locale, method]
          properties:
            accepted:
              type: boolean
              const: true
            notice_version:
              type: string
              maxLength: 80
            locale:
              type: string
              enum: [ar, en]
            method:
              type: string
              enum: [electronic, written]
    ChildUpdateRequest:
      type: object
      additionalProperties: false
      description: Optional DOB follows approved OQ-15; sensitive changes require existing M2 permissions and audit metadata without note content.
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 190
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [female, male, unspecified]
        emergency_contact_name:
          type: [string, 'null']
          maxLength: 190
        emergency_contact_phone_e164:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        safety_notes:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [active, restricted]

    GuardianChildRelationship:
      type: object
      required: [guardian_id, child_id, relationship, can_check_out, is_primary, status, created_at]
      properties:
        guardian_id:
          $ref: '#/components/schemas/Ulid'
        child_id:
          $ref: '#/components/schemas/Ulid'
        relationship:
          type: string
          enum: [mother, father, legal_guardian, authorized_pickup, other]
        can_check_out:
          type: boolean
        is_primary:
          type: boolean
        status:
          type: string
          enum: [active, revoked]
        relationship_verified_at:
          type: [string, 'null']
          format: date-time
          description: Staff relationship-verification fact; distinct from the checkout evidence method still open under OQ-12.
        created_at:
          type: string
          format: date-time
    GuardianChildRelationshipCreateRequest:
      type: object
      additionalProperties: false
      description: Links/reactivates a same-tenant guardian after approved staff verification. Authorized pickup and other cannot consent; the last active checkout-capable legal guardian cannot be revoked.
      required: [child_id, relationship, can_check_out, is_primary, verification_method, verification_value]
      properties:
        child_id:
          $ref: '#/components/schemas/Ulid'
        relationship:
          type: string
          enum: [mother, father, legal_guardian, authorized_pickup, other]
        can_check_out:
          type: boolean
        is_primary:
          type: boolean
        verification_method:
          type: string
          enum: [registered_phone_last_four]
        verification_value:
          type: string
          pattern: '^[0-9]{4}$'
          description: Compared server-side with the registered guardian phone and never stored.

    FamilyConsentEvent:
      type: object
      additionalProperties: false
      required: [id, guardian_id, child_id, consent_type, status, notice_version, locale, method, occurred_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        guardian_id:
          $ref: '#/components/schemas/Ulid'
        child_id:
          $ref: '#/components/schemas/Ulid'
        consent_type:
          type: string
          enum: [child_data, marketing]
        status:
          type: string
          enum: [granted, withdrawn]
        notice_version:
          type: string
        locale:
          type: string
          enum: [ar, en]
        method:
          type: string
          enum: [electronic, written]
        occurred_at:
          type: string
          format: date-time

    PricingRule:
      type: object
      required:
        - id
        - code
        - name
        - version
        - billing_mode
        - base_duration_seconds
        - base_price_minor
        - overtime_unit_seconds
        - overtime_price_minor
        - overtime_rounding
        - grace_period_seconds
        - pause_billing_mode
        - currency
        - tax_rate_bps
        - tax_mode
        - status
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        branch_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        code:
          type: string
        name:
          type: string
        version:
          type: integer
          minimum: 1
        billing_mode:
          type: string
          enum: [fixed_duration, per_unit]
        base_duration_seconds:
          type: integer
          minimum: 0
        base_price_minor:
          type: integer
          minimum: 0
        overtime_unit_seconds:
          type: integer
          minimum: 1
        overtime_price_minor:
          type: integer
          minimum: 0
